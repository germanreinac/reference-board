<!doctype html>
<!-- Addresses typed without the "#" (artdirection.io/board/my-board) land here:
     send them to the app, which keeps its place after the "#". -->
<meta charset="utf-8">
<title>artdirection.io</title>
<script>
  var path = location.pathname.replace(/^\/+/, '');
  location.replace('/' + (/^(board|inbox|add)(\/|$)/.test(path) ? '#/' + path : ''));
</script>
